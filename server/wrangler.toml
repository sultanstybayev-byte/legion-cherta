# Нужен только если разворачиваешь из командной строки (npx wrangler deploy).
# Через сайт Cloudflare этот файл не нужен — см. README.md.
name = "cherta"
main = "worker.js"
compatibility_date = "2025-01-01"
keep_vars = true

[vars]
OWNER_ID = "933048474"
ALLOWED_ORIGIN = "https://sultanstybayev-byte.github.io"

[[d1_databases]]
binding = "DB"
database_name = "legion"
